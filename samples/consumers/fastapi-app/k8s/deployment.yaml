apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: api
          image: shopfast/notification-service:1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef: { name: notification-secrets }
