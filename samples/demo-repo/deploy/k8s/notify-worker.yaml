apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: notify-worker }
  template:
    metadata:
      labels: { app: notify-worker }
    spec:
      containers:
        - name: notify-worker
          image: shopfast/notify-worker:latest
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: notify-worker
spec:
  selector: { app: notify-worker }
  ports: [{ port: 8080, targetPort: 8080 }]
