# Continuous feedback: fail a pull request when the committed architecture model has Critical findings.
#
# Workflow: extract the model once with the SecureFlow UI (repo scan or diagram), download it from the
# Report tab ("Model JSON"), commit it as `secureflow-model.json`, and keep it updated with the architecture.
# The deterministic rules run in CI without any AI key, in well under a second.
#
# Copy this file to .github/workflows/secureflow.yml in the repository you want to gate.
name: secureflow
on:
  pull_request:
  push:
    branches: [main]
jobs:
  resilience-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: your-org/SecureFlow   # the SecureFlow tool repository
          path: secureflow
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Analyze committed model
        run: |
          dotnet run --project secureflow/src/SecureFlow.Cli -- analyze --model secureflow-model.json --json > secureflow-findings.json
          dotnet run --project secureflow/src/SecureFlow.Cli -- analyze --model secureflow-model.json --fail-on critical
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-findings
          path: secureflow-findings.json
