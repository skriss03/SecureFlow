# TEMPLATE ONLY: never commit real values. Create the secret from the command line instead, e.g.
#   oc create secret generic secureflow-secrets \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=SecureFlow__Auth__Tokens__0=<team token 1> \
#     --from-literal=SecureFlow__Auth__Tokens__1=<team token 2>
# or source it from your vault (External Secrets / Sealed Secrets) with the same keys.
apiVersion: v1
kind: Secret
metadata:
  name: secureflow-secrets
  labels: { app: secureflow }
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  SecureFlow__Auth__Tokens__0: "REPLACE_ME"
