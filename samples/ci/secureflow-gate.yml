# Continuous feedback: scan every pull request with SecureFlow and fail it on Critical findings.
#
# The runner builds the repo digest locally (secrets redacted), uploads it to your SecureFlow server,
# waits for the analysis and prints the report URL into the job log. The server holds the AI keys;
# the pipeline only needs a SecureFlow token.
#
# Setup (repository settings):
#   variables:  SECUREFLOW_SERVER        e.g. https://secureflow.apps.example.com
#               SECUREFLOW_CLI_BASE_URL  folder holding <version>/secureflow-<rid>, e.g. your Artifactory generic repo
#   secrets:    SECUREFLOW_TOKEN
#
# Copy this file to .github/workflows/secureflow.yml in the repository you want to gate. Maven, Gradle,
# npm and pip projects can call their wrapper instead of the curl step (mvn secureflow:scan, etc.).
name: secureflow
on:
  pull_request:
  push:
    branches: [main]
jobs:
  secureflow-gate:
    runs-on: ubuntu-latest
    env:
      SECUREFLOW_SERVER: ${{ vars.SECUREFLOW_SERVER }}
      SECUREFLOW_TOKEN: ${{ secrets.SECUREFLOW_TOKEN }}
      SECUREFLOW_CLI_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4
      - name: Get the SecureFlow CLI
        run: |
          curl -fsSL "${{ vars.SECUREFLOW_CLI_BASE_URL }}/${SECUREFLOW_CLI_VERSION}/secureflow-linux-x64" -o secureflow
          chmod +x secureflow
      - name: Scan and gate
        run: ./secureflow scan --fail-on critical --out secureflow-report.md
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureflow-report
          path: secureflow-report.md
