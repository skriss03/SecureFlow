services:
  gateway:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - storefront

  storefront:
    build: ./src/Storefront
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - Orders__BaseUrl=http://orders-api:8080
      - Redis__ConnectionString=redis:6379
    depends_on:
      - orders-api
      - redis

  orders-api:
    build: ./src/Orders
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - sqlserver
      - inventory-api
      - notify-worker

  inventory-api:
    build: ./src/Inventory
    environment:
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - sqlserver

  notify-worker:
    build: ./src/Notifications
    environment:
      - ASPNETCORE_URLS=http://+:8080

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=P@ssw0rd!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mssql-data:
