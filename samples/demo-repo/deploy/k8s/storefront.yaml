apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
spec:
  replicas: 2
  selector:
    matchLabels: { app: storefront }
  template:
    metadata:
      labels: { app: storefront }
    spec:
      containers:
        - name: storefront
          image: shopfast/storefront:latest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: Orders__BaseUrl, value: "http://orders-api:8080" }
            - { name: Redis__ConnectionString, value: "redis:6379" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: storefront
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: storefront }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
spec:
  selector: { app: storefront }
  ports: [{ port: 8080, targetPort: 8080 }]
